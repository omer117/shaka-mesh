
services:
  # מסד הנתונים הייעודי עבור beach-service
  beach-db:
    image: postgis/postgis:16-3.4
    container_name: shaka-beach-db
    environment:
      POSTGRES_USER: shaka_user
      POSTGRES_PASSWORD: shaka_password
      POSTGRES_DB: shaka_beach_db
    ports:
      - "5433:5432"
    volumes:
      - beach_db_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaka_user -d shaka_beach_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - shaka-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shaka-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: surfer_dev
      RABBITMQ_DEFAULT_PASS: surfer_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - shaka-network

  beach-service:
    image: omer117/shaka-beach-service:latest
    build:
      context: ..
      dockerfile: services/beach-service/Dockerfile
    environment:
      DATABASE_URL: postgres://shaka_user:shaka_password@beach-db:5432/shaka_beach_db?sslmode=disable
      AMQP_URL: amqp://surfer_dev:surfer_dev_password@rabbitmq:5672/
      HTTP_ADDR: :8080
      SWELL_REFRESH_INTERVAL: ${SWELL_REFRESH_INTERVAL:-30m}
      E2E_ALERT_TEST_TOKEN: ${E2E_ALERT_TEST_TOKEN:-}
    expose:
      - "8080"
    depends_on:
      beach-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - shaka-network

  auth-service:
    image: omer117/shaka-auth-service:latest
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgres://shaka_user:shaka_password@beach-db:5432/shaka_beach_db?sslmode=disable
      # RS256 signing key (PEM). Leave all unset for local dev: auth-service then generates
      # an ephemeral key at startup and logs a warning. See deployments/.env.example.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PRIVATE_KEY_FILE: ${JWT_PRIVATE_KEY_FILE:-}
      JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PREVIOUS_PUBLIC_KEYS:-}
      JWT_PREVIOUS_PUBLIC_KEYS_FILE: ${JWT_PREVIOUS_PUBLIC_KEYS_FILE:-}
      JWT_ISSUER: shaka-mesh-auth
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      JWT_TTL: ${JWT_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      # Local compose is plain http; browsers drop Secure cookies there (Safari always,
      # Chrome/Firefox allow localhost only). The cloud override sets this back to true.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      HTTP_ADDR: :8081
      BEACH_SERVICE_URL: http://beach-service:8080
      AVATAR_STORAGE_DIR: ${AVATAR_STORAGE_DIR:-/data/avatars}
    volumes:
      - avatar_data:/data/avatars
    expose:
      - "8081"
    volumes:
      # Optional key files for JWT_PRIVATE_KEY_FILE=/run/secrets/<name>.pem (git-ignored directory).
      - ./secrets:/run/secrets:ro
    depends_on:
      beach-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - shaka-network

  notification-service:
    image: omer117/shaka-notification-service:latest
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      HTTP_ADDR: :8082
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      AMQP_URL: amqp://surfer_dev:surfer_dev_password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - shaka-network

  community-service:
    image: omer117/shaka-community-service:latest
    build:
      context: ..
      dockerfile: services/community-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://shaka_user:shaka_password@beach-db:5432/shaka_beach_db?sslmode=disable"
      HTTP_ADDR: :8083
    expose:
      - "8083"
    depends_on:
      beach-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - shaka-network

  api-gateway:
    image: omer117/shaka-api-gateway:latest
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      HTTP_ADDR: :8000
      AUTH_SERVICE_URL: http://auth-service:8081
      BEACH_SERVICE_URL: http://beach-service:8080
      COMMUNITY_SERVICE_URL: http://community-service:8083
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # Verifies RS256 tokens with the public keys auth-service publishes (JWKS); holds no secret.
      JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: shaka-mesh-auth
      # Brute-force limits for POST /auth/login and /auth/register (token buckets).
      AUTH_RATE_LIMIT_IP_BURST: ${AUTH_RATE_LIMIT_IP_BURST:-20}
      AUTH_RATE_LIMIT_IP_PER_MINUTE: ${AUTH_RATE_LIMIT_IP_PER_MINUTE:-20}
      AUTH_RATE_LIMIT_EMAIL_BURST: ${AUTH_RATE_LIMIT_EMAIL_BURST:-5}
      AUTH_RATE_LIMIT_EMAIL_PER_MINUTE: ${AUTH_RATE_LIMIT_EMAIL_PER_MINUTE:-5}
      # 0 = ignore X-Forwarded-For (clients connect directly). The cloud overlay sets 1 for Caddy.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      beach-service:
        condition: service_healthy
      community-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - shaka-network

volumes:
  avatar_data:
  beach_db_data:
  rabbitmq_data:

networks:
  shaka-network:
    driver: bridge
    name: shaka-network